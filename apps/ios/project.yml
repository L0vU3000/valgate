name: ValgateiOS
options:
  bundleIdPrefix: com.valgate.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ALWAYS_SEARCH_USER_PATHS: NO
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.3.9
targets:
  ValgateiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/ValgateiOS/App
      - path: Sources/ValgateiOS/Configuration
      - path: Sources/ValgateiOS/DesignSystem
      - path: Sources/ValgateiOS/Models
      - path: Sources/ValgateiOS/Networking
      - path: Sources/ValgateiOS/Views
    info:
      path: Sources/ValgateiOS/Info.plist
      properties:
        CFBundleDisplayName: Valgate
        UILaunchScreen: {}
        API_BASE_URL: $(VALGATE_API_BASE_URL)
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        VERCEL_PROTECTION_BYPASS: $(VERCEL_PROTECTION_BYPASS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valgate.ios.readonlyfoundation
        PRODUCT_NAME: Valgate
        PRODUCT_MODULE_NAME: ValgateiOS
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: Clerk
        product: ClerkKit
        link: true
        embed: false
      - package: Clerk
        product: ClerkKitUI
        link: true
        embed: false
  ValgateiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ValgateiOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valgate.ios.readonlyfoundation.tests
        PRODUCT_NAME: ValgateiOSTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ValgateiOS
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Valgate.app/Valgate
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    dependencies:
      - target: ValgateiOS
schemes:
  ValgateiOS:
    build:
      targets:
        ValgateiOS: all
        ValgateiOSTests: [test]
    test:
      config: Debug
      targets:
        - ValgateiOSTests
