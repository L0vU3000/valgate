name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on new pushes to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: [self-hosted, macOS, xcode]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Environment
        run: |
          export PATH=/Applications/Xcode.app/Contents/Developer/usr/bin:/Users/hermes/.gem/ruby/2.6.0/bin:$PATH
          xcodebuild -version
          xcrun simctl list devices available | head -5

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ValgateiOS.xcodeproj \
            -scheme ValgateiOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            | xcpretty

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ValgateiOS.xcodeproj \
            -scheme ValgateiOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            | xcpretty

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7